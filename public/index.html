<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能数据分析 Agent - 演示系统</title>
  <script src="lib/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }
    
    header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    header p {
      font-size: 1.1em;
      opacity: 0.9;
    }
    
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }
    
    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .card h2 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 1.5em;
    }
    
    /* 对话区域 */
    .chat-container {
      height: 400px;
      overflow-y: auto;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    
    .message {
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 10px;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.user {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      margin-left: 50px;
    }
    
    .message.agent {
      background: white;
      border: 2px solid #e9ecef;
      margin-right: 50px;
    }
    
    .message.system {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      font-size: 0.9em;
    }
    
    .input-group {
      display: flex;
      gap: 10px;
    }
    
    .input-group input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s;
    }
    
    .input-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .input-group button {
      padding: 12px 25px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      transition: transform 0.2s;
    }
    
    .input-group button:hover {
      transform: translateY(-2px);
    }
    
    .input-group button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* 文件上传区域 */
    .upload-area {
      border: 2px dashed #ddd;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .upload-area:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }
    
    .upload-content {
      padding: 10px;
    }
    
    .upload-icon {
      font-size: 2em;
      margin-bottom: 10px;
    }
    
    #upload-status {
      margin-top: 10px;
      font-size: 0.9em;
    }
    
    .upload-success {
      color: #28a745;
    }
    
    .upload-error {
      color: #dc3545;
    }
    
    .dataset-item {
      padding: 10px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 0.9em;
    }
    
    .dataset-item .name {
      font-weight: bold;
      color: #333;
    }
    
    .dataset-item .info {
      color: #666;
      font-size: 0.85em;
      margin-top: 3px;
    }
    
    /* 工具展示 */
    .tools-list {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .tool-item {
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    
    .tool-item h3 {
      color: #333;
      margin-bottom: 5px;
      font-size: 1em;
    }
    
    .tool-item p {
      color: #666;
      font-size: 0.9em;
    }
    
    /* 示例问题 */
    .examples {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }
    
    .example-btn {
      padding: 10px;
      background: #e7f3ff;
      border: 1px solid #b3d9ff;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    
    .example-btn:hover {
      background: #667eea;
      color: white;
      transform: translateX(5px);
    }
    
    /* 图表展示 */
    #chart-container {
      width: 100%;
      height: 500px;
      margin-top: 20px;
    }
    
    /* 加载动画 */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* 流式展示样式 */
    .stream-content {
      margin-top: 10px;
    }
    
    .step-indicator {
      display: inline-block;
      padding: 4px 8px;
      background: #e7f3ff;
      color: #667eea;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .tool-call {
      margin: 10px 0;
      padding: 10px;
      background: #fff3cd;
      border-left: 3px solid #ffc107;
      border-radius: 4px;
      animation: fadeIn 0.3s ease;
    }
    
    .tool-name {
      font-weight: bold;
      color: #856404;
      margin: 5px 0;
    }
    
    .args-preview {
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
      color: #666;
      background: #f8f9fa;
      padding: 5px;
      border-radius: 3px;
      overflow-x: auto;
    }
    
    .tool-result {
      margin: 10px 0;
      padding: 10px;
      background: #d4edda;
      border-left: 3px solid #28a745;
      border-radius: 4px;
      animation: fadeIn 0.3s ease;
    }
    
    .final-response {
      margin-top: 15px;
      padding: 15px;
      background: #e7f3ff;
      border-left: 3px solid #667eea;
      border-radius: 4px;
      animation: fadeIn 0.3s ease;
    }
    
    .final-response p {
      margin-top: 10px;
      line-height: 1.6;
    }
    
    .message-content {
      margin-top: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .error {
      color: #dc3545;
      font-weight: bold;
    }
    
    /* 响应式 */
    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 智能数据分析 Agent</h1>
      <p>基于 ReAct 架构的自主决策数据分析系统 | 自然语言驱动的数据可视化</p>
    </header>
    
    <div class="main-grid">
      <!-- 左侧面板 -->
      <div class="left-panel">
        <div class="card" style="margin-bottom: 20px;">
          <h2>💬 对话交互</h2>
          <div class="chat-container" id="chat-container">
            <div class="message agent">
              <strong>Agent:</strong> 你好！我是智能数据分析助手，可以帮你：
              <ul style="margin-top: 10px; padding-left: 20px;">
                <li>📊 查询销售数据</li>
                <li>📈 生成可视化图表</li>
                <li>📉 统计分析指标</li>
                <li>💾 导出分析结果</li>
              </ul>
              <p style="margin-top: 10px;">请用自然语言描述你想查看的数据分析需求！</p>
            </div>
          </div>
          <div class="input-group">
            <input type="text" id="user-input" placeholder="例如：我想看华东地区各产品的销售情况">
            <button id="send-btn" onclick="sendMessage()">发送</button>
          </div>
        </div>
        
        <div class="card" style="margin-bottom: 20px;">
          <h2>🚀 上传数据文件</h2>
          <div class="upload-area" id="upload-area">
            <input type="file" id="file-input" accept=".csv,.xlsx,.xls" style="display: none;">
            <div class="upload-content" onclick="document.getElementById('file-input').click()">
              <div class="upload-icon">📤</div>
              <div>点击或拖拽文件到此处上传</div>
              <div style="font-size: 0.85em; color: #999; margin-top: 5px;">支持 CSV、Excel 文件</div>
            </div>
          </div>
          <div id="upload-status"></div>
          <div id="datasets-list" style="margin-top: 15px;"></div>
        </div>
        
        <div class="card">
          <h2>🛠️ Agent 工具集</h2>
          <div class="tools-list" id="tools-list"></div>
          
          <h3 style="margin-top: 20px; color: #667eea;">💡 示例问题</h3>
          <div class="examples">
            <button class="example-btn" onclick="useExample('展示华东地区各产品的销售总额')">
              展示华东地区各产品的销售总额
            </button>
            <button class="example-btn" onclick="useExample('绘制2024年上半年各月份的销售趋势折线图')">
              绘制2024年上半年各月份的销售趋势折线图
            </button>
            <button class="example-btn" onclick="useExample('统计所有地区的笔记本电脑总销量')">
              统计所有地区的笔记本电脑总销量
            </button>
            <button class="example-btn" onclick="useExample('用饼图展示各地区的销售占比')">
              用饼图展示各地区的销售占比
            </button>
            <button class="example-btn" onclick="useExample('用雷达图展示各产品的销售指标')">
              用雷达图展示各产品的销售指标
            </button>
            <button class="example-btn" onclick="useExample('用散点图展示销量与销售额的关系')">
              用散点图展示销量与销售额的关系
            </button>
            <button class="example-btn" onclick="useExample('用环形图展示各地区销售额占比')">
              用环形图展示各地区销售额占比
            </button>
            <button class="example-btn" onclick="useExample('用仪表盘展示目标完成率')">
              用仪表盘展示目标完成率
            </button>
          </div>
        </div>
      </div>
      
      <!-- 右侧图表区域 -->
      <div class="card">
        <h2>📊 数据可视化</h2>
        <div id="chart-container"></div>
      </div>
    </div>
  </div>
  
  <script>
    let chart = null;
    
    // 初始化
    async function init() {
      // 加载工具列表
      try {
        const response = await fetch('/api/tools');
        const data = await response.json();
        if (data.success) {
          const toolsList = document.getElementById('tools-list');
          toolsList.innerHTML = data.tools.map(tool => `
            <div class="tool-item">
              <h3>${tool.name}</h3>
              <p>${tool.description}</p>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('加载工具列表失败:', error);
      }
      
      // 初始化图表
      chart = echarts.init(document.getElementById('chart-container'));
      
      // 回车发送
      document.getElementById('user-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
      });
      
      // 初始化文件上传
      initFileUpload();
      loadDatasets();
    }
    
    // 初始化文件上传
    function initFileUpload() {
      const fileInput = document.getElementById('file-input');
      const uploadStatus = document.getElementById('upload-status');
      
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        uploadStatus.innerHTML = '<span>正在上传和解析文件...</span>';
        
        const formData = new FormData();
        formData.append('file', file);
        
        try {
          const response = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          
          const result = await response.json();
          
          if (result.success) {
            uploadStatus.innerHTML = `<span class="upload-success">✅ 文件上传成功！${result.dataset.rowCount} 行数据，${result.dataset.columns.length} 列</span>`;
            loadDatasets();
          } else {
            uploadStatus.innerHTML = `<span class="upload-error">❌ ${result.error}</span>`;
          }
        } catch (error) {
          uploadStatus.innerHTML = `<span class="upload-error">❌ 上传失败: ${error.message}</span>`;
        }
        
        // 清空文件输入
        fileInput.value = '';
      });
    }
    
    // 加载数据集列表
    async function loadDatasets() {
      try {
        const response = await fetch('/api/datasets');
        const result = await response.json();
        
        const datasetsList = document.getElementById('datasets-list');
        
        if (result.datasets && result.datasets.length > 0) {
          datasetsList.innerHTML = '<h4 style="margin-bottom: 10px; color: #667eea;">已上传的数据集：</h4>' + 
            result.datasets.map(d => `
              <div class="dataset-item">
                <div class="name">📄 ${d.name}</div>
                <div class="info">${d.rowCount} 行 × ${d.columns.length} 列</div>
              </div>
            `).join('');
        } else {
          datasetsList.innerHTML = '';
        }
      } catch (error) {
        console.error('加载数据集失败:', error);
      }
    }
    
    // 添加消息到聊天框
    function addMessage(role, content) {
      const chatContainer = document.getElementById('chat-container');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;
      
      if (role === 'agent' && content.includes('调用工具')) {
        messageDiv.innerHTML = `<strong>Agent:</strong> ${content}<div class="loading" style="margin-top: 10px;"></div>`;
      } else {
        messageDiv.innerHTML = `<strong>${role === 'user' ? '你' : 'Agent'}:</strong> ${content}`;
      }
      
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      
      return messageDiv;
    }
    
    // 发送消息（流式版本）
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const userInput = input.value.trim();
      
      if (!userInput) return;
      
      input.disabled = true;
      sendBtn.disabled = true;
      
      addMessage('user', userInput);
      input.value = '';
      
      const agentMessageDiv = document.createElement('div');
      agentMessageDiv.className = 'message agent';
      agentMessageDiv.innerHTML = '<strong>Agent:</strong> <div class="stream-content"></div>';
      document.getElementById('chat-container').appendChild(agentMessageDiv);
      
      const streamContent = agentMessageDiv.querySelector('.stream-content');
      let messageContent = '';
      
      try {
        const response = await fetch('/api/agent/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userInput })
        });
        
        if (!response.ok) {
          throw new Error(`服务器错误: ${response.status}`);
        }
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          
          let currentEvent = '';
          let currentData = '';
          
          for (const line of lines) {
            if (line.startsWith('event:')) {
              currentEvent = line.substring(6).trim();
            } else if (line.startsWith('data:')) {
              currentData = line.substring(5).trim();
              
              if (currentData && currentEvent) {
                 try {
                   const eventData = JSON.parse(currentData);
                   
                   if (currentEvent === 'step' && eventData.type === 'step_start') {
                     const stepId = `step-${eventData.step}`;
                     streamContent.innerHTML += `<div id="${stepId}" class="step-indicator">正在执行第 ${eventData.step} 步...</div>`;
                     scrollToBottom();
                   }
                   else if (currentEvent === 'message' && eventData.type === 'content') {
                     messageContent += eventData.content;
                     let msgEl = streamContent.querySelector('.message-content');
                     if (!msgEl) {
                       msgEl = document.createElement('div');
                       msgEl.className = 'message-content';
                       streamContent.appendChild(msgEl);
                     }
                     msgEl.innerHTML = messageContent.replace(/\n/g, '<br>');
                     scrollToBottom();
                     // 小延迟让浏览器有时间渲染
                     await new Promise(r => setTimeout(r, 30));
                   }
                   else if (currentEvent === 'tool_call') {
                     const stepId = `step-${eventData.step}`;
                     const stepEl = document.getElementById(stepId);
                     if (stepEl) {
                       stepEl.textContent = `第 ${eventData.step} 步完成`;
                       stepEl.style.background = '#d4edda';
                       stepEl.style.color = '#28a745';
                     }
                     
                     const stepIndicator = `<div class="step-indicator">第 ${eventData.step} 步</div>`;
                     const toolName = `<div class="tool-name">🛠️ 调用工具: ${eventData.tool}</div>`;
                     const argsPreview = `<div class="args-preview">${JSON.stringify(eventData.args).substring(0, 100)}</div>`;
                     
                     streamContent.innerHTML += `<div class="tool-call">${stepIndicator}${toolName}${argsPreview}</div>`;
                     scrollToBottom();
                   }
                   else if (currentEvent === 'tool_result') {
                     streamContent.innerHTML += `<div class="tool-result">✅ ${eventData.result.summary}</div>`;
                     scrollToBottom();
                   }
                   else if (currentEvent === 'complete') {
                     const stepElements = streamContent.querySelectorAll('.step-indicator');
                     stepElements.forEach(el => {
                       if (el.textContent.includes('正在执行')) {
                         const stepMatch = el.textContent.match(/第 (\d+) 步/);
                         if (stepMatch) {
                           el.textContent = `第 ${stepMatch[1]} 步完成`;
                           el.style.background = '#d4edda';
                           el.style.color = '#28a745';
                         }
                       }
                     });
                     
                     if (eventData.chartConfig) {
                       renderChart(eventData.chartConfig);
                     }
                   }
                   else if (currentEvent === 'end') {
                     input.disabled = false;
                     sendBtn.disabled = false;
                     input.focus();
                   }
                   else if (currentEvent === 'error') {
                     streamContent.innerHTML = `<div class="error">❌ 执行失败: ${eventData.error}</div>`;
                     input.disabled = false;
                     sendBtn.disabled = false;
                     input.focus();
                   }
                 } catch (e) {
                   console.warn('JSON解析异常', e);
                 }
               }
            }
          }
        }
        
      } catch (error) {
        streamContent.innerHTML = `<div class="error">❌ 请求失败: ${error.message}</div>`;
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }
    
    // 滚动到底部
    function scrollToBottom() {
      const chatContainer = document.getElementById('chat-container');
      requestAnimationFrame(() => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      });
    }
    
    // 渲染图表
    function renderChart(config) {
      const chartType = config.type;
      const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#fa709a', '#fee140'];
      
      let option = {
        title: {
          text: config.title,
          left: 'center',
          textStyle: { fontSize: 20, fontWeight: 'bold' }
        },
        tooltip: {
          trigger: chartType === 'pie' || chartType === 'doughnut' ? 'item' : 'axis'
        },
        legend: {
          top: 'bottom',
          data: config.labels || []
        },
        series: []
      };
      
      // 根据图表类型配置不同的选项
      if (chartType === 'pie' || chartType === 'doughnut') {
        option.tooltip.formatter = '{b}: {c} ({d}%)';
        option.series.push({
          name: config.title,
          type: chartType,
          data: config.labels.map((label, i) => ({
            name: label,
            value: config.values[i]
          })),
          radius: chartType === 'doughnut' ? ['40%', '70%'] : '65%',
          emphasis: {
            itemStyle: {
              shadowBlur: 10,
              shadowOffsetX: 0,
              shadowColor: 'rgba(0, 0, 0, 0.5)'
            }
          },
          label: {
            show: true,
            formatter: '{b}: {c}'
          }
        });
      }
      else if (chartType === 'radar') {
        option.tooltip = { trigger: 'item' };
        option.radar = {
          indicator: config.labels.map(label => ({ name: label, max: Math.max(...config.values) * 1.2 })),
          shape: 'circle',
          splitNumber: 5,
          axisName: { color: '#666' }
        };
        option.series.push({
          name: config.title,
          type: 'radar',
          data: [{
            value: config.values,
            name: config.title,
            areaStyle: { opacity: 0.3 }
          }],
          itemStyle: { color: colors[0] },
          lineStyle: { width: 2 }
        });
      }
      else if (chartType === 'scatter') {
        option.xAxis = {
          type: 'value',
          name: config.xLabel || 'X',
          axisLabel: { fontSize: 12 }
        };
        option.yAxis = {
          type: 'value',
          name: config.yLabel || 'Y',
          axisLabel: { fontSize: 12 }
        };
        option.series.push({
          name: config.title,
          type: 'scatter',
          symbolSize: 15,
          data: config.values.map((y, i) => [i, y]),
          itemStyle: {
            color: colors[0],
            shadowBlur: 10,
            shadowColor: 'rgba(0,0,0,0.3)'
          }
        });
      }
      else if (chartType === 'heatmap') {
        option.xAxis = {
          type: 'category',
          data: config.xLabels || config.labels,
          axisLabel: { fontSize: 10, rotate: 45 }
        };
        option.yAxis = {
          type: 'category',
          data: config.yLabels || ['数据'],
          axisLabel: { fontSize: 10 }
        };
        option.visualMap = {
          min: 0,
          max: Math.max(...config.values.flat()) || 100,
          calculable: true,
          orient: 'horizontal',
          left: 'center',
          bottom: '0%',
          inRange: {
            color: ['#f0f9ff', '#007bff']
          }
        };
        const heatmapData = [];
        config.values.forEach((row, yi) => {
          row.forEach((value, xi) => {
            heatmapData.push([xi, yi, value]);
          });
        });
        option.series.push({
          name: config.title,
          type: 'heatmap',
          data: heatmapData,
          label: { show: true, fontSize: 10 },
          emphasis: {
            itemStyle: {
              shadowBlur: 10,
              shadowColor: 'rgba(0, 0, 0, 0.5)'
            }
          }
        });
      }
      else if (chartType === 'gauge') {
        option.series.push({
          name: config.title,
          type: 'gauge',
          detail: { formatter: '{value}', fontSize: 20 },
          data: [{ value: config.values[0], name: config.labels[0] || '完成率' }],
          axisLine: {
            lineStyle: {
              width: 20,
              color: [
                [0.3, '#67e0e3'],
                [0.7, '#37a2da'],
                [1, '#fd666d']
              ]
            }
          },
          pointer: { itemStyle: { color: 'auto' } }
        });
      }
      else {
        // 默认柱状图、折线图等
        option.tooltip.trigger = 'axis';
        option.xAxis = {
          type: 'category',
          data: config.labels,
          axisLabel: { fontSize: 12 }
        };
        option.yAxis = {
          type: 'value',
          axisLabel: { fontSize: 12 }
        };
        
        const isLine = chartType === 'line';
        option.series.push({
          name: config.title,
          type: chartType,
          data: config.values,
          smooth: isLine,
          areaStyle: isLine ? { opacity: 0.3 } : null,
          itemStyle: {
            color: function(params) {
              return colors[params.dataIndex % colors.length];
            }
          },
          label: {
            show: chartType === 'bar',
            position: 'top'
          },
          lineStyle: {
            width: isLine ? 3 : 1
          }
        });
      }
      
      chart.setOption(option, true);
    }
    
    // 使用示例问题
    function useExample(example) {
      document.getElementById('user-input').value = example;
      sendMessage();
    }
    
    // 页面加载完成后初始化
    window.addEventListener('load', init);
    
    // 窗口大小改变时重绘图表
    window.addEventListener('resize', () => {
      if (chart) chart.resize();
    });
  </script>
</body>
</html>
